    result_cache: review/phase_reports_091/headtohead_tables.csv

  - id: h2h6-met-diag-gxe
    estimator: flexybayes
    dgp: met-genotype-variance-by-site
    n: 240
    condition: clean
    kind: correctness
    oracle_class: M-D
    oracle_ref: "asreml random = ~ Geno + diag(Env):Geno, same grammar on both sides"
    quantity_class: var_component
    result_cache: review/phase_reports_091/headtohead_tables.csv

  - id: h2h6-het-residual-by-env
    estimator: flexybayes
    dgp: met-residual-variance-by-site
    n: 240
    condition: clean
    kind: correctness
    oracle_class: M-D
    oracle_ref: "asreml residual = ~ dsum(~ units | Env), same grammar on both sides"
    quantity_class: var_component
    result_cache: review/phase_reports_091/headtohead_tables.csv

  # --- Study 5: alternative-implementation hunt (recipe 63) ------------
  #
  # `review/phase_reports_091/alternatives_flexybayes.yaml` declares the
  # estimand, the tolerances and the not-the-same-question note for each
  # entry BEFORE any fit ran. One shared 60-row gaussian fixture.

  - id: alt-e1-hand-rolled-reml
    estimator: flexybayes
    dgp: gaussian-random-intercept
    n: 60
    params: {sd_g: 0.8, sigma: 1.0}
    condition: clean
    kind: correctness
    oracle_class: M-B
    oracle_ref: "a dense-V profile REML written for the rehearsal from Patterson & Thompson (1971) / Harville (1977) without reading the package emit"
    quantity_class: var_component
    tolerance: 0.30
    tolerance_rationale: "relative band declared before the run; a posterior mean of a right-skewed SD sits above the REML point at 10 groups"
    result_cache: review/phase_reports_091/alternatives_results.csv

  - id: alt-e1-competitor-implementations
    estimator: flexybayes
    dgp: gaussian-random-intercept
    n: 60
    params: {sd_g: 0.8, sigma: 1.0}
    condition: clean
    kind: correctness
    oracle_class: M-D
    oracle_ref: "lme4::lmer, glmmTMB::glmmTMB, MCMCglmm::MCMCglmm and asreml on identical data"
    quantity_class: var_component
    tolerance: 0.30
    tolerance_rationale: "as alt-e1-hand-rolled-reml; the fixed-effect band is 0.05 and the residual band 0.10"
    result_cache: review/phase_reports_091/alternatives_results.csv

  - id: alt-e2-heteroscedastic-residual-ratio
    estimator: flexybayes
    dgp: gaussian-two-level-residual-variance
    n: 60
    condition: clean
    kind: correctness
    oracle_class: M-D
    oracle_ref: "nlme::lme with varIdent and glmmTMB with dispformula; the RATIO is the quantity all three name"
    quantity_class: var_component
    tolerance: 0.15
    tolerance_rationale: "declared before the run; the three parameterise the heteroscedasticity differently, so only the ratio is comparable"
    result_cache: review/phase_reports_091/alternatives_results.csv

  # --- Stability / edge of domain (F22) --------------------------------

  - id: stability-spatial-field-collapse
    estimator: flexybayes
    dgp: separable-ar1-field
    n: 120
    params: {p_missing: 0.10, n_hole_patterns: 10}
    condition: missing
    kind: stability
    oracle_class: M-A
    oracle_ref: "expected: the field standard deviation runs to its floor on 5 of 10 hole patterns and the fit says so, rather than reporting a converged mode with the variance absorbed into the nugget"
    quantity_class: var_component
    result_cache: tests/testthat/test-spatial-field-collapse.R

  - id: stability-weak-identification-inla
    estimator: flexybayes
    dgp: gaussian-random-intercept-two-per-cluster
    n: 56
    params: {n_clusters: 28, obs_per_cluster: 2}
    condition: clean
    kind: stability
    oracle_class: M-A
    oracle_ref: "expected: the fit completes and the structured convergence record carries the weak identification (execution-grid cell S6-inla-weak)"
    quantity_class: var_component
    result_cache: inst/validation/execution_grid/ledger.csv

  - id: stability-funnel-divergence-brms
    estimator: flexybayes
    dgp: gaussian-random-intercept-near-zero-between-variance
    n: 24
    params: {n_clusters: 3, sd_between: 0.02, adapt_delta: 0.5, max_treedepth: 5}
    condition: clean
    kind: stability
    oracle_class: M-A
    oracle_ref: "expected: the fit completes and the divergent transitions are on the fit object (execution-grid cells S6-brms-funnel and S6-brms-funnel-tight)"
    quantity_class: mcmc_summary
    result_cache: inst/validation/execution_grid/ledger.csv

  # --- Stochastic calibration (F21) ------------------------------------
  #
  # The one calibration study the package has. It is a genuine
  # interval-coverage study through `flexybayes()` -- and it is BELOW the
  # V3 floor on three counts, all of them stated in README.md and waived
  # there rather than glossed here: 10 replicates per cell against the
  # tier's 1,000, a 0.7.0.9000 candidate rather than this release, and a
  # backend set that still included the native engine withdrawn entirely
  # in 0.9.3 (see NEWS.md).

  - id: calibration-interval-coverage-recovery
    estimator: flexybayes
    dgp: gaussian-binomial-poisson-random-intercept-and-fixed
    n: 240
    params: {b0: 0.5, b1: 0.8, tau: 1.0, sigma: 0.7}
    condition: clean
    kind: calibration
    method: coverage
    n_sim: 10
    oracle_class: M-E
    oracle_ref: "simulation with known truth; the credible interval is scored for covering it, over 3 families x 2 structures x 3 backends x 10 replicates (180 fits, 480 parameter rows)"
    quantity_class: coverage
    result_cache: release-validation/results/validation_results.rds
