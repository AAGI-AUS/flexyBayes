# inst/validation/scenarios.yaml -- the numerical-validation registry
# (rubrics/validation_ladder.md, schema templates/validation/README.md).
#
# Every row below is an EXISTING study. Nothing here was simulated to fill
# a tier floor: the five studies are the design-preserving missingness
# sweep, the heterogeneous-variance three-arm oracle, the five-model
# ASReml head-to-head, the six-pair ASReml comparison of 2026-08-18, and
# the recipe-63 alternative-implementation hunt, plus the stability cells
# the suite and the execution grid already assert and the one
# interval-coverage study the package has.
#
# `n` is the number of observations in the scenario's data cell, read from
# the generating script rather than recalled. `result_cache` names the
# artefact the numbers come from: a path under `inst/validation/` where
# the package ships a copy, and a workspace-relative path where it does
# not. The README beside this file records which artefacts are shipped
# copies and which are not, and what that means for `check_scenarios.R`.
#
# What this registry does NOT yet cover at the declared tier is written
# down in README.md rather than papered over here.

tier: V3
package_version: "0.9.3"
generated_on: 2026-08-19

scenarios:

  # --- Study 1: design-preserving missingness sweep --------------------
  #
  # 170 banked cells x 25 seeds, 66,388 rows. Five designs crossed with
  # seven missing-response proportions (slice A), four non-ignorable
  # mechanisms at three strengths (slice B), and three trial sizes
  # (slice C). Generating scripts: `design-preserving-missingness/
  # sweep_full.R` and `report_sweep.R`. Data sizes are the design
  # dimensions in `design-preserving-missingness/R/designs.R`.

  - id: missing-sweep-rcbd-proportions
    estimator: flexybayes
    dgp: randomised-complete-blocks
    n: 60
    params: {var_block: 1.0, var_gen: 2.0, var_residual: 0.8}
    condition: missing
    kind: correctness
    oracle_class: M-D
    oracle_ref: "asreml missing-plot device (-F phi), 7 proportions x 25 seeds"
    quantity_class: var_component
    result_cache: inst/validation/report_sweep.txt

  - id: missing-sweep-ibd-proportions
    estimator: flexybayes
    dgp: incomplete-blocks
    n: 72
    params: {var_block: 1.0, var_gen: 2.0, var_residual: 0.8}
    condition: imbalance
    kind: correctness
    oracle_class: M-D
    oracle_ref: "asreml missing-plot device, non-orthogonal blocking"
    quantity_class: var_component
    result_cache: inst/validation/report_sweep.txt

  - id: missing-sweep-rowcol-proportions
    estimator: flexybayes
    dgp: row-column
    n: 100
    condition: missing
    kind: correctness
    oracle_class: M-D
    oracle_ref: "asreml missing-plot device, 7 proportions x 25 seeds"
    quantity_class: var_component
    result_cache: inst/validation/report_sweep.txt

  - id: missing-sweep-spatial-proportions
    estimator: flexybayes
    dgp: separable-ar1-field
    n: 120
    condition: missing
    kind: correctness
    oracle_class: M-D
    oracle_ref: "asreml missing-plot device; `omit` refuses on a holed grid"
    quantity_class: var_component
    result_cache: inst/validation/report_sweep.txt

  - id: missing-sweep-met-proportions
    estimator: flexybayes
    dgp: multi-environment-trial
    n: 180
    condition: missing
    kind: correctness
    oracle_class: M-D
    oracle_ref: "asreml missing-plot device, 7 proportions x 25 seeds"
    quantity_class: var_component
    result_cache: inst/validation/report_sweep.txt

  # The device identity itself, against a REML that shares no code with
  # it. The pooled result over the five designs at p <= 0.20 is 4,000
  # comparisons, none exceeding 1e-2, largest 0.0097.

