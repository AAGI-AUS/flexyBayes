  # --- Study 4: six-pair ASReml comparison, 2026-08-18 -----------------
  #
  # `review/phase_reports_091/headtohead_run.R` (workspace). Same design,
  # different estimator, on every pair: ASReml returns an AI-REML point
  # estimate and flexyBayes a posterior.

  - id: h2h6-rcbd-complete
    estimator: flexybayes
    dgp: randomised-complete-blocks
    n: 96
    params: {sd_block: 0.7, sd_error: 0.5}
    condition: clean
    kind: correctness
    oracle_class: M-D
    oracle_ref: "asreml 4.2.0.392, yield ~ Variety, random = ~ Block"
    quantity_class: var_component
    result_cache: review/phase_reports_091/headtohead_tables.csv

  - id: h2h6-rcbd-missing10
    estimator: flexybayes
    dgp: randomised-complete-blocks
    n: 96
    params: {n_missing: 10}
    condition: missing
    kind: correctness
    oracle_class: M-D
    oracle_ref: "asreml with na.method(y = 'include') against the default augment path"
    quantity_class: var_component
    result_cache: review/phase_reports_091/headtohead_tables.csv

  - id: h2h6-rowcol-ar1-complete
