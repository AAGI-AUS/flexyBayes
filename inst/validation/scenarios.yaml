  # models, with the simulating truth, the ASReml estimate and the
  # flexyBayes estimate kept as separate columns. The parameter counts
  # are the structural check.

  - id: h2h-rcbd
    estimator: flexybayes
    dgp: randomised-complete-blocks
    n: 96
    params: {var_block: 1.0, var_gen: 2.0}
    condition: clean
    kind: correctness
    oracle_class: M-D
    oracle_ref: "asreml 4.2.0.392, REML point estimates on identical data"
    quantity_class: var_component
    result_cache: inst/validation/head_to_head_summary.csv

  - id: h2h-rcbd-large
    estimator: flexybayes
    dgp: randomised-complete-blocks
    n: 1800
    condition: clean
    kind: correctness
    oracle_class: M-D
    oracle_ref: "asreml 4.2.0.392, 30 x 60 layout -- enough levels to determine the components"
    quantity_class: var_component
    result_cache: inst/validation/head_to_head_summary.csv

