  # --- Study 2: heterogeneous-variance three-arm oracle -----------------
  #
  # `design-preserving-missingness/oracle_heterogeneous.R`. Both probes
  # assert the parameter COUNT before comparing any value.

  - id: het-diag-site-by-gen
    estimator: flexybayes
    dgp: met-genotype-variance-by-site
    n: 480
    params: {sd_gen_by_site: [0.5, 1.2, 2.2], sd_residual: 0.6}
    condition: clean
    kind: correctness
    oracle_class: M-D
    oracle_ref: "asreml 4.2.0.392 diag(site):gen and an independent lme4 dummy() expansion"
    quantity_class: var_component
    result_cache: inst/validation/oracle_het.log

  - id: het-dsum-residual-by-site
    estimator: flexybayes
    dgp: met-residual-variance-by-site
    n: 360
    params: {sd_gen: 0.8, sd_residual_by_site: [0.4, 1.0, 2.0]}
    condition: clean
    kind: correctness
    oracle_class: M-D
    oracle_ref: "asreml 4.2.0.392, nlme::varIdent, and a direct brms::brm() under brms's own priors"
    quantity_class: var_component
    result_cache: inst/validation/oracle_het.log

  # --- Study 3: five-model ASReml head-to-head -------------------------
  #
