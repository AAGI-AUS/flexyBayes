    dgp: randomised-complete-blocks
    n: 60
    condition: missing
    kind: correctness
    oracle_class: M-B
    oracle_ref: "independently written dense-V observed-data REML (no shared code)"
    quantity_class: var_component
    tolerance: 1e-2
    tolerance_rationale: "the band the report reads the identity at; 0 of 4000 pooled comparisons at p <= 0.20 exceed it"
    result_cache: inst/validation/report_sweep.txt

  - id: missing-device-identity-ibd
    estimator: flexybayes
    dgp: incomplete-blocks
    n: 72
    condition: missing
    kind: correctness
