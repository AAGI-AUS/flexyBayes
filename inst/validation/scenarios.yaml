    condition: clean
    kind: correctness
    oracle_class: M-D
    oracle_ref: "asreml residual = ~ ar1(Row):ar1(Col); the three- versus four-parameter difference is reported, not hidden"
    quantity_class: var_component
    result_cache: review/phase_reports_091/headtohead_tables.csv

