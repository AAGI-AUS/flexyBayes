url: https://aagi-aus.github.io/flexyBayes/

template:
  bootstrap: 5
  bootswatch: cosmo

development:
  mode: auto

home:
  title: flexyBayes — Flexible Bayesian mixed models with ASReml and brms-style syntax
  description: >
    Specify mixed models using ASReml-style or brms-style formula syntax,
    estimate them via INLA or brms (Stan), and compare the same model
    across engines with triangulate(), a diagnostic on a gated overlap
    rather than a validation contract.

navbar:
  structure:
    left:  [intro, reference, articles, tutorials, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/flexyBayes-01-getting-started.html
    articles:
      text: Tutorials
      menu:
        - text: 01 — Getting started
          href: articles/flexyBayes-01-getting-started.html
        - text: 02 — The formula surface
          href: articles/flexyBayes-02-formulas-and-dispatch.html
        - text: 03 — Regression and hierarchical models
          href: articles/flexyBayes-03-regression-and-hierarchical.html
        - text: 04 — Priors
          href: articles/flexyBayes-04-priors.html
        - text: "---"
        - text: 05 — METs and genomics
          href: articles/flexyBayes-05-met-and-genomics.html
        - text: 06 — Spatial and temporal
          href: articles/flexyBayes-06-spatial-and-temporal.html
        - text: 07 — After the fit
          href: articles/flexyBayes-07-after-the-fit.html
        - text: 08 — Big data
          href: articles/flexyBayes-08-big-data.html
reference:
  - title: Verbs
    desc: >
      The universal entry, the single-engine pins, the feasibility
      planner, cross-engine triangulation, and approximation validation.
