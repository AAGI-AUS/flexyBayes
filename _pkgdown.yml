url: https://aagi-aus.github.io/flexyBayes/

template:
  bootstrap: 5
  bootswatch: cosmo

development:
  mode: auto

home:
  title: flexyBayes — Flexible Bayesian mixed models with ASReml and brms-style syntax
  description: >
    Specify mixed models using ASReml-style or brms-style formula syntax
    and estimate them via INLA or brms (Stan). The ASReml grammar reaches
    INLA natively, so multi-stratum designs, per-environment residuals and
    factor-analytic covariance fit by approximation rather than by MCMC.

navbar:
  structure:
    left:  [intro, reference, articles, tutorials, news]
    right: [search, github]
  components:
    intro:
      text: Get started
      href: articles/flexyBayes-01-mixed-models.html
    articles:
      text: Articles
      menu:
        - text: 01 — Mixed models in brief
          href: articles/flexyBayes-01-mixed-models.html
        - text: 02 — Bayesian estimation in brief
          href: articles/flexyBayes-02-bayesian.html
        - text: 03 — The ASReml syntax covered
          href: articles/flexyBayes-03-syntax.html
        - text: 04 — ASReml and flexyBayes side by side
          href: articles/flexyBayes-04-illustration.html
