articles:
  - title: Read in order
    desc: >
      Five pages, enough to start work: what a mixed model is, what
      changes when it is estimated as a posterior, every ASReml spelling
      the package covers, one worked comparison, and how a candidate
      block is selected over.
    contents:
      - flexyBayes-01-mixed-models
      - flexyBayes-02-bayesian
      - flexyBayes-03-syntax
      - flexyBayes-04-illustration
      - flexyBayes-05-selection

