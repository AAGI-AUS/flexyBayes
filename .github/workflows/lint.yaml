on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: lint

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # cyclocomp is a lintr extra; declare to avoid the v0.4.3 gotcha.
          # knitr + rmarkdown are the VignetteBuilder, needed to build
          # local::. (the package) for linting.
          extra-packages: any::lintr, any::cyclocomp, any::knitr, any::rmarkdown, local::.
          needs: lint
          # "hard" stops pak from trying to resolve the special-repo /
          # heavy Suggests (INLA) which fail to solve on CI.
          dependencies: '"hard"'

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          # Hard gate. The .lintr config disables object_length and
          # commented_code with rationale and relaxes line_length for
          # tests/; whatever lint_package() then reports fails the check.
          # This comment asserts the configuration, not a lint count --
          # a count stated here goes stale silently the next time a line
          # grows, which is the drift class the next step guards.
          LINTR_ERROR_ON_LINT: true

      # The claim-surface guards. These read SOURCE (roxygen prose,
      # DESCRIPTION, NAMESPACE, workflow files), so they cannot run from
      # a built tarball at R CMD check time and do not belong in
      # testthat. This is the only place they fire automatically.
      - name: Definition of done (claim-surface guards)
        run: Rscript tools/definition_of_done.R
